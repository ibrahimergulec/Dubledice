<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Profesyonel 3D Rastgele Zar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Üst Bölme - Profesyonel Canlı Mavi Geçişli Zemin */
    #bolme-ust {
      flex: 1;
      background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
      position: relative;
      cursor: pointer;
    }

    /* Alt Bölme - Uyumlu Koyu/Mat Profesyonel Zemin */
    #bolme-alt {
      flex: 1;
      background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
      position: relative;
      cursor: pointer;
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ipucu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="bolme-ust"></div>
    <div id="bolme-alt"></div>
  </div>

  <div id="ipucu">Zar atmak için ekrana dokunun</div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    
    const domElement = renderer.domElement;
    domElement.id = 'canvas3d';
    document.body.appendChild(domElement);

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
    mainLight.position.set(4, 12, 8);
    scene.add(mainLight);

    // Zar Yüzü Çizimi (Canvas Texture)
    function zarYuzuOlustur(sayi) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 16;
      ctx.strokeRect(0, 0, 512, 512);

      ctx.fillStyle = '#0f172a';
      const nokta = (x, y) => {
        ctx.beginPath();
        ctx.arc(x, y, 42, 0, Math.PI * 2);
        ctx.fill();
      };

      const c = 256, l = 135, r = 377;

      if (sayi === 1) { nokta(c, c); }
      if (sayi === 2) { nokta(l, l); nokta(r, r); }
      if (sayi === 3) { nokta(l, l); nokta(c, c); nokta(r, r); }
      if (sayi === 4) { nokta(l, l); nokta(r, l); nokta(l, r); nokta(r, r); }
      if (sayi === 5) { nokta(l, l); nokta(r, l); nokta(c, c); nokta(l, r); nokta(r, r); }
      if (sayi === 6) { nokta(l, l); nokta(r, l); nokta(l, c); nokta(r, c); nokta(l, r); nokta(r, r); }

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 4;
      return texture;
    }

    const materyaller = [
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(1), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(6), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(2), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(5), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(3), roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: zarYuzuOlustur(4), roughness: 0.2 })
    ];

    const geometry = new THREE.BoxGeometry(1.6, 1.6, 1.6);

    function konumHesapla() {
      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
      return { ustY: height / 4, altY: -height / 4 };
    }

    camera.position.z = 6.5;
    const konumlar = konumHesapla();

    const zarlar = [
      { mesh: new THREE.Mesh(geometry, materyaller), yHedef: konumlar.ustY, hedefRot: { x: 0, y: 0 } },
      { mesh: new THREE.Mesh(geometry, materyaller), yHedef: konumlar.altY, hedefRot: { x: 0, y: 0 } }
    ];

    zarlar.forEach(zar => {
      zar.mesh.position.set(0, zar.yHedef, 0);
      scene.add(zar.mesh);
    });

    const yuzAciSozlugu = {
      1: { x: 0, y: -Math.PI / 2 },
      6: { x: 0, y: Math.PI / 2 },
      2: { x: -Math.PI / 2, y: 0 },
      5: { x: Math.PI / 2, y: 0 },
      3: { x: 0, y: 0 },
      4: { x: 0, y: Math.PI }
    };

    let donuyor = false;
    const ipucuEl = document.getElementById('ipucu');

    function zarlariAt() {
      if (donuyor) return;
      donuyor = true;
      ipucuEl.style.opacity = '0';

      // HER ATIŞTA 1 İLE 6 ARASINDA RASTGELE SAYI ÜRETME
      const ustSayi = Math.floor(Math.random() * 6) + 1;
      const altSayi = Math.floor(Math.random() * 6) + 1;

      const secilenler = [ustSayi, altSayi];

      zarlar.forEach((zar, index) => {
        const hedefSayi = secilenler[index];
        const acilar = yuzAciSozlugu[hedefSayi];

        // Rastgele dönme hissi vermesi için fazladan rastgele tam tur ekleniyor
        const ekstraTurX = (Math.floor(Math.random() * 3) + 2) * Math.PI * 2;
        const ekstraTurY = (Math.floor(Math.random() * 3) + 2) * Math.PI * 2;

        zar.hedefRot.x = acilar.x + ekstraTurX;
        zar.hedefRot.y = acilar.y + ekstraTurY;
      });

      setTimeout(() => {
        donuyor = false;
        // Animasyon bitince açıları net sonuca sabitle
        zarlar.forEach((zar, index) => {
          const hedefSayi = secilenler[index];
          zar.mesh.rotation.x = yuzAciSozlugu[hedefSayi].x;
          zar.mesh.rotation.y = yuzAciSozlugu[hedefSayi].y;
          zar.mesh.rotation.z = 0;
        });
      }, 1300);
    }

    window.addEventListener('pointerdown', zarlariAt);

    function animate() {
      requestAnimationFrame(animate);

      zarlar.forEach(zar => {
        if (donuyor) {
          zar.mesh.rotation.x += (zar.hedefRot.x - zar.mesh.rotation.x) * 0.08;
          zar.mesh.rotation.y += (zar.hedefRot.y - zar.mesh.rotation.y) * 0.08;
        } else {
          zar.mesh.position.y = zar.yHedef;
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      const yeniKonumlar = konumHesapla();
      zarlar[0].yHedef = yeniKonumlar.ustY;
      zarlar[1].yHedef = yeniKonumlar.altY;
    });
  </script>

</body>
</html>
